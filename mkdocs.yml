site_name: Curso de Programação Orientada a Objetos
site_description: Trilha de POO para Engenharia com C++ e Python
site_url: ""
repo_url: "https://github.com/rafaelrezo/curso-poo"
repo_name: "rafaelrezo/curso-poo"

theme:
  name: readthedocs
  locale: pt_BR
  include_homepage_in_sidebar: true
  navigation_depth: 6
  titles_only: false
  sticky_navigation: true
  collapse_navigation: false
  prev_next_buttons_location: bottom
  highlightjs: true
  hljs_languages:
    - cpp
    - python
    - json
    - yaml

plugins:
  - search
  - mkdocs-video

extra_css:
  - stylesheets/extra.css
  - stylesheets/readthedocs-responsive.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

# Materiais avaliativos e operacionais podem ficar versionados no repositório,
# mas não devem entrar no site publicado no GitHub Pages.
exclude_docs: |
  fundamentos_poo_cpp_python/index.md
  fundamentos_poo_cpp_python/03_sobrecarga_construtores/index.md
  fundamentos_poo_cpp_python/04_encapsulamento_heranca/index.md
  fundamentos_poo_cpp_python/05_polimorfismo/index.md
  fundamentos_poo_cpp_python/06_arquivos_json/index.md
  fundamentos_poo_cpp_python/07_data_timestamp/index.md
  modelagem_analise_codigo/index.md
  parte-2-projeto/02-heranca-e-polimorfismo.md
  parte-2-projeto/03-encapsulamento-e-validacao.md
  parte-2-projeto/04-regras-de-controle.md
  parte-2-projeto/06-tratamento-erros-excecoes.md
  plano_de_implementacao.md
  referencias.md
  avaliacoes/
  guias_operacionais/github_classroom_pages.md
  guias_operacionais/uso_ia_skills.md
  projeto_integrador/
  parte-2-projeto/especificacao-projeto-final.md
  parte-2-projeto/especificacao-projeto-final.html
  parte-2-projeto/especificacao-projeto-final.pdf
  parte-2-projeto/especificacao-projeto-recuperacao.md
  parte-2-projeto/especificacao-projeto-recuperacao.html
  parte-2-projeto/especificacao-projeto-recuperacao.pdf
  parte-2-projeto/guia-avaliacao-projeto-recuperacao.md
  parte-2-projeto/guia-avaliacao-projeto-recuperacao.html
  parte-2-projeto/guia-avaliacao-projeto-recuperacao.pdf

nav:
  - Início: index.md
  - 01. Fundamentos Git e IDE: fundamentos_git_ide/index.md
  - 02. Revisão de Programação e Algoritmos: revisao_programacao_algoritmos/index.md
  - 03. Do C aos Objetos: fundamentos_poo_cpp_python/03_transicao_objetos/index.md
  - 04. Encapsulamento e Interface Pública: fundamentos_poo_cpp_python/04_objetos_validos/index.md
  - 05. Composição e Responsabilidades: fundamentos_poo_cpp_python/05_composicao/index.md
  - 06. Herança e Especialização: fundamentos_poo_cpp_python/06_heranca_polimorfismo/index.md
  - 07. Polimorfismo e Contratos: fundamentos_poo_cpp_python/07_polimorfismo/index.md
  - 08. Coleções Dinâmicas: fundamentos_poo_cpp_python/07_colecoes_dinamicas/index.md
  - 09. Contrato JSON e Integração: fundamentos_poo_cpp_python/08_integracao_json/index.md
  - 10. Exceções e Consolidação: fundamentos_poo_cpp_python/09_excecoes_consolidacao/index.md
  - 11. Parte 2 - Projeto Integrador:
      - Visão geral: parte-2-projeto/index.md
      - 01. Arquitetura e Contrato: parte-2-projeto/01-cenario-e-modelagem.md
      - 02. Strategy, Command e Repository: parte-2-projeto/05-strategy-e-command.md
      - 03. Observer, Eventos e Alarmes: parte-2-projeto/06-observer-e-alarmes.md
      - 04. Banco de Dados no Supervisório: parte-2-projeto/05-bancos-de-dados-supervisorio.md
      - 05. Persistência e Repository: parte-2-projeto/07-persistencia.md
      - 06. Comunicação TCP: parte-2-projeto/08-comunicacao-tcp.md
      - 07. Testes e Qualidade: parte-2-projeto/09-testes-e-validacao.md
      - 08. Testes Automatizados: parte-2-projeto/10-testes-automatizados-cpp-python.md
      - 09. CI e Validação: parte-2-projeto/11-ci-validacao-producao.md
      - 10. Projeto Final: parte-2-projeto/10-projeto-final.md
  - 12. Checklist Profissional de Entrega: guias_operacionais/checklist_entrega_profissional.md
